<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="vme999's personal portfolio and public projects." />
    <title>vme999 · Personal Portfolio</title>
    <style>
      :root {
        --ink: #101014;
        --paper: #f5f5fa;
        --blue: #76cef3;
        --lime: #c1ff4c;
        --coral: #ff8a7e;
        --lavender: #cfbaff;
        --yellow: #ffd66b;
        --line: 4px solid var(--ink);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a { color: inherit; text-decoration: none; }
      .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 80px; }

      nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 68px; }
      .brand { font-size: 22px; font-weight: 900; letter-spacing: -1px; }
      .nav-link, .pill {
        display: inline-flex; align-items: center; justify-content: center; border: 3px solid var(--ink);
        border-radius: 999px; font-weight: 850; background: white;
      }
      .nav-link { min-height: 43px; padding: 0 16px; box-shadow: 4px 4px 0 var(--blue); }
      .nav-link:hover, .button:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--blue); }

      .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 34px; align-items: center; margin-bottom: 86px; }
      .eyebrows { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 18px; }
      .pill { padding: 6px 12px; font-size: 13px; letter-spacing: .5px; box-shadow: 3px 3px 0 var(--ink); }
      .pill.blue { background: var(--blue); }.pill.lime { background: var(--lime); }.pill.coral { background: var(--coral); }
      h1 { max-width: 700px; margin: 0; font-size: clamp(50px, 8vw, 100px); line-height: .92; letter-spacing: -6px; font-weight: 950; }
      .intro { max-width: 610px; margin: 24px 0 30px; font-size: clamp(18px, 2.5vw, 25px); line-height: 1.55; font-weight: 650; color: #565764; }
      .button { display: inline-flex; align-items: center; gap: 9px; padding: 14px 20px; border: var(--line); border-radius: 999px; background: var(--ink); color: white; font-size: 17px; font-weight: 850; box-shadow: 7px 7px 0 var(--blue); transition: .15s ease; }

      .portrait { position: relative; min-height: 330px; display: grid; place-items: center; }
      .portrait-card { position: relative; z-index: 1; width: min(100%, 350px); aspect-ratio: 1; display: grid; place-items: center; border: var(--line); border-radius: 40% 45% 38% 44%; background: var(--blue); box-shadow: 12px 12px 0 var(--ink); overflow: hidden; }
      .portrait-card img { width: 74%; border: 4px solid var(--ink); border-radius: 50%; background: white; }
      .bubble { position: absolute; border: var(--line); border-radius: 999px; font-weight: 900; }
      .bubble.one { top: 10px; right: 2px; width: 78px; height: 78px; background: var(--coral); }
      .bubble.two { bottom: 5px; left: 0; padding: 13px 18px; background: var(--lime); font-size: 15px; transform: rotate(-8deg); }

      .section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
      h2 { margin: 0; font-size: clamp(31px, 5vw, 50px); line-height: 1; letter-spacing: -2.5px; }
      .counter { font-size: 15px; font-weight: 800; color: #5c5d69; }
      .projects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .project { min-height: 232px; display: flex; flex-direction: column; justify-content: space-between; padding: 23px; border: var(--line); border-radius: 30px; box-shadow: 7px 7px 0 var(--ink); transition: .18s ease; }
      .project:hover { transform: translate(-3px, -3px); box-shadow: 11px 11px 0 var(--ink); }
      .project:nth-child(4n+1) { background: var(--blue); }.project:nth-child(4n+2) { background: var(--lime); }.project:nth-child(4n+3) { background: var(--coral); }.project:nth-child(4n) { background: var(--lavender); }
      .project-tag { align-self: flex-start; padding: 5px 9px; border: 2px solid var(--ink); border-radius: 999px; background: white; font-size: 12px; font-weight: 900; letter-spacing: .65px; }
      .project h3 { margin: 16px 0 8px; font-size: 24px; line-height: 1.04; letter-spacing: -1px; overflow-wrap: anywhere; }
      .project p { margin: 0; font-weight: 650; line-height: 1.35; }
      .project-arrow { align-self: flex-end; font-size: 30px; font-weight: 900; line-height: .8; }
      .empty { grid-column: 1 / -1; background: var(--yellow); }
      .footer { display: flex; justify-content: space-between; gap: 18px; margin-top: 72px; padding-top: 20px; border-top: var(--line); font-size: 14px; font-weight: 750; }

      @media (max-width: 760px) {
        .page { width: min(100% - 32px, 560px); padding-top: 20px; }
        nav { margin-bottom: 45px; }.hero { grid-template-columns: 1fr; gap: 24px; margin-bottom: 62px; }
        h1 { letter-spacing: -4px; }.portrait { min-height: 280px; order: -1; }.portrait-card { width: 270px; }
        .projects { grid-template-columns: 1fr; }.footer { margin-top: 56px; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <nav aria-label="Main navigation">
        <a class="brand" href="/">vme999</a>
        <a class="nav-link" href="https://github.com/vme999" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>

      <section class="hero">
        <div>
          <div class="eyebrows"><span class="pill blue">HELLO THERE</span><span class="pill lime">CODE</span><span class="pill coral">AI</span></div>
          <h1>Hello,<br />I'm vme999.</h1>
          <p class="intro">A place for the tools, experiments, and ideas I build.</p>
          <a class="button" href="#projects">Explore projects <span>↓</span></a>
        </div>
        <div class="portrait" aria-hidden="true">
          <span class="bubble one"></span>
          <div class="portrait-card"><img id="profile-avatar" src="https://github.com/vme999.png?size=460" alt="vme999's profile photo" /></div>
        </div>
      </section>

      <section id="projects">
        <div class="section-head"><h2>Selected Projects</h2><span id="project-count" class="counter">Loading public projects…</span></div>
        <div id="project-list" class="projects" aria-live="polite"></div>
      </section>

      <footer class="footer"><span>© 2026 vme999</span><a href="https://github.com/vme999" target="_blank" rel="noreferrer">Made with curiosity ↗</a></footer>
    </main>

    <script>
      const username = 'vme999';
      const list = document.querySelector('#project-list');
      const count = document.querySelector('#project-count');
      const publicProjectCopy = {
        mysql_readonly_mcp: 'A TypeScript MCP server for safe, read-only MySQL access.',
        reqPatch: 'A DevTools extension for capturing and temporarily patching fetch / XHR JSON requests.',
        public_holiday_tool: 'A utility for checking public holidays and working days in mainland China.',
        Flux: 'An iOS bookkeeping app with trend analysis and CSV import / export.',
        GeoDash: 'An iOS app for location, movement, pressure, and map data.',
        XChangeNow: 'A Swift project. Explore the repository for details.'
      };
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]);
      const publicCard = repo => `<a class="project" href="${escapeHtml(repo.html_url)}" target="_blank" rel="noreferrer"><span class="project-tag">${escapeHtml(repo.language || 'PROJECT')}</span><div><h3>${escapeHtml(repo.name)}</h3><p>${escapeHtml(publicProjectCopy[repo.name] || repo.description || 'Explore this project on GitHub.')}</p></div><span class="project-arrow">↗</span></a>`;

      fetch(`https://api.github.com/users/${username}`)
        .then(response => response.ok ? response.json() : null)
        .then(profile => {
          if (profile?.avatar_url) document.querySelector('#profile-avatar').src = `${profile.avatar_url}&size=460`;
        })
        .catch(() => {});

      fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`)
        .then(response => { if (!response.ok) throw new Error('GitHub API unavailable'); return response.json(); })
        .then(repos => {
          const visible = repos.filter(repo => repo.name !== `${username}.github.io` && !repo.fork);
          count.textContent = visible.length === 1 ? '1 public project' : `${visible.length} public projects`;
          list.innerHTML = visible.length
            ? visible.map(publicCard).join('')
            : '<article class="project empty"><span class="project-tag">COMING SOON</span><div><h3>No public projects yet.</h3><p>Check back soon.</p></div><span class="project-arrow">→</span></article>';
        })
        .catch(() => {
          count.textContent = 'Public projects unavailable';
          list.innerHTML = '<article class="project empty"><span class="project-tag">GITHUB</span><div><h3>Projects are unavailable right now.</h3><p>Please try again later.</p></div><span class="project-arrow">↗</span></article>';
        });
    </script>
  </body>
</html>
